# Standalone core build. A standalone build doesn't read the root gradle.properties, so these mirror
# it and paper/gradle.properties (kept in sync by hand).
jna_version=5.14.0
# Compile-time only (accessor generation).
lombok_version=1.18.46
# Minecraft and Paper both provide these at runtime. The core compiles against them, and the tests
# bring their own copies.
netty_version=4.1.118.Final
gson_version=2.11.0
# Test-only.
junit_version=5.11.4
# The oldest Java a consumer targets: the MC <=1.20.4 nodes and Paper jars. Override with
# -Pjava_version=21 to run the tests on FFM instead of JNA.
java_version=17
