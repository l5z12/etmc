# Standalone Paper build — values mirrored from the root build (kept in sync manually; Paper is
# intentionally decoupled from the Stonecutter root so a server-only build never touches the loaders).
version=0.1.0
archives_base_name=etmc
jna_version=5.14.0
# Compile-time only (accessor generation); never shipped in the plugin jar.
lombok_version=1.18.46
# Provided by the server at runtime; needed to compile the shared EtmcChannel (and to test it).
netty_version=4.1.118.Final
# Test-only (unit tests for the shared common/ sources; never shipped in the plugin jar).
junit_version=5.11.4
gson_version=2.11.0
# Default targets (CI overrides per MC version via -Ppaper_version / -Ppaper_java).
paper_version=1.21.10-R0.1-SNAPSHOT
