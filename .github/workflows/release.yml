name: release

# Cut a release by pushing a tag (e.g. `v0.1.0`): build any missing natives at the release commit
# (reusing whatever's committed there), assemble the loader jars with them, and attach the jars (and
# the Paper plugin jars) to the GitHub Release. `workflow_dispatch` runs the same build WITHOUT
# publishing (a dry run).
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      easytier_ref:
        description: "EasyTier git ref to build any missing natives from (empty = the pinned commit)"
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build only the natives missing at the release commit (committed ones are reused). Missing ones
  # (macOS) are built from the pinned EasyTier commit (natives/easytier.commit), so every platform in
  # a release runs the same EasyTier.
  natives:
    uses: ./.github/workflows/natives.yml
    with:
      easytier_ref: ${{ github.event.inputs.easytier_ref || '' }}

  # Assemble the loader jars; picks up the freshly-built native-* artifacts from the natives job above.
  jars:
    needs: natives
    uses: ./.github/workflows/build.yml
    # No secrets to pass: the decompile cache's key comes from the r2-cache environment, which build.yml's jobs use.

  publish:
    name: publish release
    needs: jars
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload assets
    steps:
      - name: Download built jars
        uses: actions/download-artifact@v8
        with:
          # build.yml uploads one etmc-jars-<shard> artifact per loader shard, plus etmc-paper-jars
          # (the Paper plugin, one jar per Paper version).
          pattern: etmc-*jars*
          merge-multiple: true
          path: jars

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: jars/**/*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true

  # The same jars on the downloads page, at https://etmc.l5z12.dev/downloads/release/<tag>/. The key to the
  # downloads bucket is in the downloads environment, which only main and v* tags may use.
  downloads:
    name: publish to downloads
    needs: jars
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'l5z12/etmc'
    runs-on: ubuntu-latest
    environment:
      name: downloads
      url: https://etmc.l5z12.dev/downloads/release/${{ github.ref_name }}/
    steps:
      - name: Checkout etmc
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: Publish to downloads
        uses: ./.github/actions/publish-downloads
        with:
          kind: release
          ref: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.DOWNLOADS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.DOWNLOADS_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.DOWNLOADS_BUCKET }}
