# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# NOTE: machine-local settings (outbound proxy, and the JDK 8 path ForgeGradle's mavenizer needs)
# live in your global ~/.gradle/gradle.properties — NOT here — so they don't break CI. See CONTRIBUTING.md.

# JNA — native loader fallback for Java 17 runtimes (MC 1.19.x / 1.20.1–1.20.4) where FFM is absent.
jna_version=5.14.0

# Lombok — compile-time only (never shipped). It hooks javac internals, so the version has to be new
# enough for the newest toolchain in the matrix: the 26.x node builds on Java 25.
lombok_version=1.18.46

# Mod
mod_version=0.1.0
maven_group=dev.l5z12
